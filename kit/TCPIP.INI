IP       DHCP               ! or a fixed address:  IP 192.168.1.240
!MASK    255.255.255.0      ! with a fixed address
!GATEWAY 192.168.1.1        ! with a fixed address
!DECNET  1.10 RSTS1         ! needed while DECnet runs: node address and name
!HOSTNAME RSTS1             ! name sent to DHCP (default: the DECnet node name)
!DNS     192.168.1.1        ! name servers (one or two); DHCP supplies them otherwise
!DOMAIN  lan                ! tried after short names (DHCP may supply it)
!PROXY   mister:3128        ! HTTP proxy that does TLS (tools/sslproxy.py), for CURL https://
!NTP     pool.ntp.org       ! time server for NETDATE (default: the gateway)
!TIMEZONE PST8PDT,M3.2.0,M11.1.0 ! POSIX TZ; NETDATE sets the clock at start-up
!                           ! only when it is given (UTC0 for UTC)
TFTP     YES                ! NO: no TFTP server (ping and the rest still run)
DETACH   YES                ! run in the background
