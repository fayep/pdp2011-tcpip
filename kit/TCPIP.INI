IP       DHCP               ! or a fixed address:  IP 192.168.1.240
!MASK    255.255.255.0      ! with a fixed address
!GATEWAY 192.168.1.1        ! with a fixed address
!DECNET  1.10 RSTS1         ! needed while DECnet runs: node address and name
!HOSTNAME RSTS1             ! name sent to DHCP (default: the DECnet node name)
DETACH   YES                ! run in the background
