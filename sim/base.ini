; SIMH 11/70 configured to match the PDP2011 MiSTer core's device set
; (boot-ROM device list: KL11 console + 3 DL11 at 176500-176526, KW11L,
; RK11 177400, RH70 176700, RL11 174400, UNIBUS map, cache, FP11; no
; PTR/PTP/LPT/DZ/HK/RX/RQ/TM/TQ). Use with the LOSIZE-fixed SIMH
; (~/Source/simh-ekbee1, 1920KW on a 4M 11/70).
set cpu 11/70, 4M
set ptr disabled
set ptp disabled
set lpt disabled
set dz disabled
set hk disabled
set rx disabled
set rq disabled
set tm disabled
set tq disabled
set dli enabled
set dli lines=3
set dli address=17776500
